<svg xmlns="http://www.w3.org/2000/svg" width="994" height="502" viewBox="0 0 994 502" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1e1e1e"/></marker></defs>
<text x="24" y="36" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="20"><tspan x="24" dy="0">What a view loads</tspan></text>
<text x="24" y="60" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="14"><tspan x="24" dy="0">The loader walks the octree. It does not take every source point.</tspan></text>
<rect x="24" y="96" width="180" height="88" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="36" y="119" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Source points</text>
<text x="36" y="119" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="36" dy="18">151.9M in the ply</tspan><tspan x="36" dy="18">about 20M in the</tspan><tspan x="36" dy="18">demo tiles</tspan></text>
<rect x="256" y="108" width="190" height="64" rx="8" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="268" y="137" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Potree octree</text>
<text x="268" y="137" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="268" dy="18">root, then children</tspan></text>
<rect x="498" y="96" width="210" height="88" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="510" y="128" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Refine a child when</text>
<text x="510" y="128" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="510" dy="18">its sphere projects</tspan><tspan x="510" dy="18">to at least 50 px</tspan></text>
<rect x="760" y="96" width="210" height="88" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="772" y="128" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Stop at the point</text>
<text x="772" y="128" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="772" dy="18">budget: 3M points</tspan><tspan x="772" dy="18">selected for the view</tspan></text>
<line x1="204" y1="140" x2="256" y2="140" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="446" y1="140" x2="498" y2="140" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="708" y1="140" x2="760" y2="140" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="248" width="170" height="52" rx="8" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="36" y="280" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="36" dy="0">Click in the view</tspan></text>
<rect x="246" y="228" width="250" height="92" rx="8" fill="#d0bfff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="258" y="262" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">GPU pick</text>
<text x="258" y="262" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="258" dy="18">reads point source id</tspan><tspan x="258" dy="18">that point's object</tspan></text>
<rect x="548" y="240" width="190" height="68" rx="8" fill="#e7f5ff" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="560" y="271" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Object selected</text>
<text x="560" y="271" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="560" dy="18">camera flies to it</tspan></text>
<rect x="246" y="360" width="280" height="72" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>
<text x="258" y="393" fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">If no point is hit</text>
<text x="258" y="393" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="15"><tspan x="258" dy="18">smallest box on the ray</tspan></text>
<line x1="194" y1="274" x2="246" y2="274" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="496" y1="274" x2="548" y2="274" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="371" y1="320" x2="386" y2="360" stroke="#1e1e1e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="24" y="470" fill="#495057" font-family="Helvetica, Arial, sans-serif" font-size="14"><tspan x="24" dy="0">Hiding structure still counts those points in the budget. The shader discards them afterwards.</tspan></text>
</svg>
