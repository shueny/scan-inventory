# Local full mode (PRD 6): one origin for the app, its API and its tiles, so the browser
# needs no CORS and the app uses the same paths as in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Look the api container up again when it is recreated (Docker's DNS), instead of
    # keeping the address from nginx's start.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_comp_level 6;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # The single-page app: unknown paths get index.html.
    location / {
        try_files $uri /index.html;
    }

    # The page itself is always revalidated, so after a rebuild it names the new assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built files have hashed names: a missing one is a 404, never index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The FastAPI service (docker compose service "api").
    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Potree tiles from ./data/potree, mounted read-only. nginx answers Range requests with
    # 206; never compress tiles, a compressed response drops Range support (ADR 0005).
    location /potree/ {
        alias /usr/share/nginx/potree/;
        gzip off;
        # Revalidate every time (ETag): after a rebuild of the tiles the browser must not mix
        # an old metadata.json or hierarchy.bin with the new octree.bin.
        add_header Cache-Control "no-cache" always;
    }
}
