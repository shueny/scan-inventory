# Static Potree tiles (PRD 6: "static data is static"). nginx answers Range requests
# with 206 by default; the loader needs that for octree.bin (ADR 0005).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /potree/ {
        # Never compress tiles: a compressed response drops Range support.
        gzip off;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
