# The quality gate on every pull request and on main (docs/RUNBOOK.md):
# make check (incl. the data source contract tests against the real API on a throwaway
# Postgres), pre-commit, and the Playwright smoke test on the committed fixture plant.
# No secrets are used; the real scan data is never needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner is thrown away after the job, so testcontainers' clean-up container is
      # not needed; one image pull less from Docker Hub (anonymous pulls are rate-limited).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major tags since v8, only full versions.
      - uses: astral-sh/setup-uv@v10.2.0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: make install

      # The API and contract tests start postgres:16-alpine. Docker Hub was unreachable or
      # rate-limited from the runners (T6 review rounds 2 and 3), so pull the same official
      # image from the AWS public mirror and tag it: testcontainers then finds it locally.
      - name: Pull test database image
        run: |
          mirror=public.ecr.aws/docker/library/postgres:16-alpine
          for attempt in 1 2 3; do
            if docker pull "$mirror"; then
              docker tag "$mirror" postgres:16-alpine
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "pull failed (attempt $attempt), retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: make check
        run: make check

      - name: pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        run: pnpm --dir web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
