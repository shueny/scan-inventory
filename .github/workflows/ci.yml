# The quality gate on every pull request and on main (docs/RUNBOOK.md):
# make check (incl. the data source contract tests against the real API on a throwaway
# Postgres), pre-commit, and the Playwright smoke test on the committed fixture plant.
# No secrets are used; the real scan data is never needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: make install

      - name: make check
        run: make check

      - name: pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Playwright browser
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        run: pnpm --dir web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
