[project]
name = "scan-inventory-pipeline"
version = "0.1.0"
description = "Offline data pipeline: instances, issues, LAS export"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laspy>=2.7.0",
    "numpy>=2.5.3",
    "plyfile>=1.1.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["plyfile", "laspy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
