# Local full mode (PRD 6): web app, API, database and a static server for the Potree tiles.
# Open http://localhost:8088 (WEB_PORT). Ports can be changed in .env (WEB_PORT, API_PORT,
# TILES_PORT), e.g. to run a second copy next to this one.
# Needs a .env next to this file (copy .env.example) and data/ built by the pipeline.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /data
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  tiles:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/tiles.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/potree:/usr/share/nginx/html/potree:ro
    ports:
      - "127.0.0.1:${TILES_PORT:-8080}:80"

  web:
    build: ./web
    volumes:
      - ./data/potree:/usr/share/nginx/potree:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  pgdata:
